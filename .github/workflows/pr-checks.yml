name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize]

# A new push supersedes the checks still running for the same PR
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # backend/src/generated is gitignored but `tsc -b` compiles it, so the
      # client has to exist before the type check. prisma.config.ts reads
      # DATABASE_URL to build its datasource block and there is no .env in CI,
      # hence the dummy value: `generate` never opens a connection.
      - name: Generate the Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public

      # tsc -b walks the project references, so this also builds shared/dist.
      - name: Type check
        run: npm run ts:check

      # The suites mock Prisma and Redis, so no service containers are needed.
      - name: Test
        run: npm test

  tests-and-comments:
    name: Tests & comments check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check tests & comments on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-tests-and-comments.mjs

  docker-build:
    name: Build dev image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build dev image
        run: docker build -f Dockerfile.dev -t rom-rag-sae-but3-dev:ci .

  assign-reviewer:
    name: Assign default reviewer
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && github.actor != 'Novachocolat'
    permissions:
      pull-requests: write
    steps:
      - name: Request review from Novachocolat
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: ["Novachocolat"],
            });
